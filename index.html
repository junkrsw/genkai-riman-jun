<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>限界リーマン純</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071426;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}body{touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100dvh}.hud{position:fixed;z-index:4;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 6px) 8px 0;pointer-events:none}.top{display:flex;gap:8px;align-items:center;background:rgba(3,18,38,.92);border:2px solid #53d6ff;border-radius:10px;padding:6px 8px}.mini{width:42px;height:42px;border-radius:8px;border:2px solid #fff;object-fit:cover;object-position:50% 35%}.stat{flex:1}.line{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:11px}.stage{color:#ffd52b;font-size:14px}.meter,.prog{height:9px;border:1px solid #fff;background:#17324d;overflow:hidden;border-radius:6px}.meter i,.prog i{display:block;height:100%;background:linear-gradient(90deg,#40ef67,#ffe436,#ff4638)}.prog i{background:#33dfff}.toast{position:fixed;z-index:7;top:24%;left:50%;transform:translateX(-50%);background:#fff;color:#071426;border:3px solid #071426;padding:7px 12px;border-radius:8px;font-weight:1000;opacity:0}.toast.on{opacity:1}.controls{position:fixed;z-index:6;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:center;padding:0 12px;pointer-events:none}.controls button{pointer-events:auto;border:3px solid #001b35;border-radius:50%;width:76px;height:76px;font-size:13px;font-weight:1000;color:#071426;box-shadow:0 5px 0 #00152c}.jump{background:#ffd52b}.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,rgba(18,86,140,.96),rgba(2,13,28,.99) 65%)}.overlay.hide,.stageclear.hide{display:none}.card{width:min(460px,100%);background:#092443;border:4px solid #fff;border-radius:16px;padding:22px;text-align:center;box-shadow:8px 8px 0 #00152c}.logo{font-weight:1000;font-size:clamp(38px,12vw,62px);line-height:.95;text-shadow:4px 4px 0 #001,6px 6px 0 #ff9800}.logo b{color:#ffd52b}.card p{line-height:1.7;color:#d9ecff}.card button{width:100%;padding:14px;border:3px solid #001b35;border-radius:10px;background:#ffd52b;font-size:20px;font-weight:1000}.help{font-size:11px;color:#9bcfe9;margin-top:10px}.stageclear{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:rgba(1,11,26,.9);text-align:center}.stageclear strong{font-size:42px;color:#ffd52b;text-shadow:4px 4px 0 #e84b00}.stageclear p{font-weight:900}@media(max-width:430px){.controls button{width:68px;height:68px}}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><img class="mini" src="normal_face.jpg"><div class="stat"><div class="line"><span id="stageName" class="stage"></span><span id="mentalText"></span></div><div class="meter"><i id="mentalBar"></i></div><div class="line" style="margin-top:4px"><span id="goalLabel"></span><span id="distance"></span></div><div class="prog"><i id="progressBar"></i></div></div></div></div><div id="toast" class="toast"></div><div class="controls"><button id="jumpBtn" class="jump">JUMP<br>▲</button></div><div id="start" class="overlay"><div class="card"><div class="help">SALARYMAN SURVIVAL</div><div class="logo">限界リーマン<br><b>純</b></div><p>障害物をジャンプでかわして、今日も退勤を目指せ。</p><button id="startBtn">出社する ▶</button><div class="help">JUMP：二段ジャンプ　PC：SPACE</div></div></div><div id="stageClear" class="stageclear hide"><div><strong id="clearTitle"></strong><p id="clearText"></p></div></div><div id="over" class="overlay hide"><div class="card"><div class="help">GAME OVER</div><div class="logo">純、<b>限界。</b></div><p id="overText"></p><button id="retryBtn">翌日も出社する</button></div></div><div id="win" class="overlay hide"><div class="card"><div class="help">ALL CLEAR</div><div class="logo">純、<b>退勤。</b></div><p>通勤、勤務、残業を乗り越えた。<br>今日も、よく走った。</p><button id="againBtn">また月曜日</button></div></div><script>(function(){'use strict';var $=s=>document.querySelector(s),c=$('#game'),ctx=c.getContext('2d'),normal=new Image(),jumpFace=new Image();normal.src='normal_face.jpg';jumpFace.src='jump_face.jpg';var W=0,H=0,DPR=1,last=0,running=false,transition=false,stage=0,dist=0,mental=15,speed=265,spawn=1.2,inv=0,player,objs=[],particles=[],toastT=0;var ST=[{name:'🚃 通勤地獄',goal:800,label:'会社まで',sky1:'#8fdcff',sky2:'#dff7ff',base:265,clear:'無事、出社してしまった。',types:[['train','長い電車',170,52,13],['crowd','満員です',60,60,11],['gate','改札ラッシュ',46,54,10],['bag','PC忘れた',40,40,9]]},{name:'🏢 勤務地獄',goal:950,label:'定時まで',sky1:'#bddfff',sky2:'#eef7ff',base:285,clear:'定時を迎えた。だが仕事は終わらない。',types:[['desk','終わらない会議',135,46,14],['excel','謎のExcel',48,48,12],['printer','紙詰まり',54,58,12],['mail','未読99+',48,48,12]]},{name:'🌙 残業地獄',goal:1050,label:'退勤まで',sky1:'#071936',sky2:'#194f77',base:305,clear:'',types:[['tasks','タスクの山',72,82,16],['clock','緊急対応',54,54,14],['desk','終わらない会議',145,48,16],['mail','至急お願いします',50,50,14]]}];function gy(){return H*.79}function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(player&&!running)player.y=gy()-player.h}function reset(){stage=0;dist=0;mental=15;speed=ST[0].base;spawn=1.2;inv=0;objs=[];particles=[];player={x:Math.max(62,W*.14),y:gy()-132,w:118,h:132,vy:0,jumps:0};updateHud()}function startGame(){reset();$('#start').classList.add('hide');$('#over').classList.add('hide');$('#win').classList.add('hide');running=true;last=performance.now();requestAnimationFrame(loop)}function jump(){if(!running||transition)return;if(player.jumps<2){player.vy=player.jumps?-650:-760;player.jumps++;burst(player.x+40,player.y+player.h,5)}}function say(t){$('#toast').textContent=t;$('#toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('on'),650)}function hit(a,b){return a.x+18<b.x+b.w&&a.x+a.w-18>b.x&&a.y+18<b.y+b.h&&a.y+a.h-8>b.y}function burst(x,y,n){for(var i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*130,life:.35+Math.random()*.3})}function spawnObj(){var s=ST[stage],r=Math.random();if(r<.09){objs.push({kind:'paid',label:'有給！',x:W+20,y:gy()-110,w:48,h:48,item:1});return}if(r<.18){objs.push({kind:'coffee',label:'コーヒー',x:W+20,y:gy()-140,w:44,h:44,item:1});return}var a=s.types[Math.floor(Math.random()*s.types.length)],air=a[0]==='mail';objs.push({kind:a[0],label:a[1],x:W+20,y:air?gy()-155:gy()-a[3],w:a[2],h:a[3],damage:a[4],hit:0})}function updateHud(){var s=ST[stage];$('#stageName').textContent='STAGE '+(stage+1)+'  '+s.name;$('#mentalText').textContent='限界度 '+Math.round(mental)+'%';$('#mentalBar').style.width=Math.min(100,mental)+'%';$('#goalLabel').textContent=s.label;$('#distance').textContent=Math.max(0,Math.ceil(s.goal-dist))+'m';$('#progressBar').style.width=Math.min(100,dist/s.goal*100)+'%'}function end(){running=false;$('#overText').innerHTML='STAGE '+(stage+1)+'で心が折れた。<br>ゴールまで <b>'+Math.ceil(Math.max(0,ST[stage].goal-dist))+'m</b>';setTimeout(()=>$('#over').classList.remove('hide'),150)}function clearStage(){transition=true;$('#stageClear').classList.remove('hide');$('#clearTitle').textContent='STAGE '+(stage+1)+' CLEAR!';$('#clearText').textContent=ST[stage].clear;setTimeout(function(){stage++;if(stage>=ST.length){running=false;$('#stageClear').classList.add('hide');$('#win').classList.remove('hide');return}dist=0;mental=Math.max(8,mental-20);speed=ST[stage].base;spawn=1.15;objs=[];player.y=gy()-player.h;player.vy=0;player.jumps=0;transition=false;$('#stageClear').classList.add('hide');updateHud()},1300)}function drawBg(){var s=ST[stage],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,s.sky1);g.addColorStop(1,s.sky2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(stage===0){ctx.fillStyle='rgba(35,90,130,.3)';for(var i=0;i<8;i++){var bx=i*115-(dist*2%115),bh=90+i%3*30;ctx.fillRect(bx,gy()-bh,72,bh)}ctx.fillStyle='#aabdc8';ctx.fillRect(0,gy()-18,W,18)}else{ctx.fillStyle=stage===2?'#19243a':'#d5e2e9';for(var j=-1;j<8;j++){var ox=j*105-(dist*2%105);ctx.fillRect(ox,gy()-160,78,160);ctx.fillStyle=stage===2?'#ffd85d':'#80b6d5';ctx.fillRect(ox+12,gy()-140,20,24);ctx.fillRect(ox+45,gy()-140,20,24);ctx.fillStyle=stage===2?'#19243a':'#d5e2e9'}}ctx.fillStyle=stage===2?'#161b27':'#31475d';ctx.fillRect(0,gy(),W,H-gy())}function drawFace(img,x,y,w,h){if(!img.complete||!img.naturalWidth)return;var sw=img.naturalWidth,sh=img.naturalHeight,sx=sw*.20,sy=sh*.16,srcW=sw*.60,srcH=sh*.68;ctx.save();ctx.beginPath();var r=16;ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(img,sx,sy,srcW,srcH,x,y,w,h);ctx.restore();ctx.strokeStyle='#071426';ctx.lineWidth=4;ctx.strokeRect(x,y,w,h)}function drawPlayer(){var px=player.x,py=player.y;ctx.save();ctx.translate(px,py);ctx.rotate(-.06);ctx.fillStyle='#102b55';ctx.strokeStyle='#071426';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(50,72);ctx.lineTo(24,99);ctx.lineTo(10,119);ctx.moveTo(57,73);ctx.lineTo(79,96);ctx.lineTo(99,116);ctx.stroke();ctx.beginPath();ctx.moveTo(44,68);ctx.lineTo(18,82);ctx.moveTo(70,67);ctx.lineTo(101,80);ctx.stroke();ctx.fillRect(33,60,48,46);ctx.fillStyle='#fff';ctx.fillRect(54,63,9,35);ctx.fillStyle='#0e57a2';ctx.beginPath();ctx.moveTo(59,67);ctx.lineTo(69,88);ctx.lineTo(59,97);ctx.lineTo(53,72);ctx.fill();ctx.fillStyle='#151b25';ctx.fillRect(3,76,31,34);ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeRect(3,76,31,34);ctx.restore();drawFace(player.jumps?jumpFace:normal,px+17,py-20,102,112)}function drawObj(o){ctx.save();if(o.hit)ctx.globalAlpha=.35;ctx.font=Math.min(44,o.h-2)+'px serif';var e={train:'🚃',crowd:'👥',gate:'🚉',bag:'💼',desk:'🪑',excel:'📊',printer:'🖨️',mail:'✉️',tasks:'📚',clock:'🕘',paid:'🏝️',coffee:'☕'}[o.kind]||'■';if(o.kind==='train'){ctx.fillStyle='#657887';ctx.fillRect(o.x,o.y+10,o.w,o.h-10);for(var z=12;z<o.w-18;z+=34){ctx.fillStyle='#d9eef7';ctx.fillRect(o.x+z,o.y+17,22,18)}}else ctx.fillText(e,o.x,o.y+o.h-4);ctx.restore()}function loop(now){if(!running)return;var dt=Math.min((now-last)/1000,.032);last=now;if(!transition){speed=Math.min(390,ST[stage].base+dist*.025);dist+=dt*speed/13;inv=Math.max(0,inv-dt);player.vy+=1900*dt;player.y+=player.vy*dt;if(player.y>=gy()-player.h){player.y=gy()-player.h;player.vy=0;player.jumps=0}spawn-=dt;if(spawn<=0){spawnObj();spawn=1.05+Math.random()*.75-stage*.04}for(var i=objs.length-1;i>=0;i--){var o=objs[i];o.x-=speed*dt;if(!o.hit&&hit(player,o)){o.hit=1;if(o.item){if(o.kind==='paid'){inv=4;say('有給！4秒無敵')}else{mental=Math.max(0,mental-25);say('コーヒーで回復')}}else if(inv<=0){mental+=o.damage;say(o.label);if(mental>=100){mental=100;updateHud();end();return}}}if(o.x+o.w<0)objs.splice(i,1)}if(dist>=ST[stage].goal)clearStage()}for(i=particles.length-1;i>=0;i--){particles[i].x+=particles[i].vx*dt;particles[i].y+=particles[i].vy*dt;particles[i].life-=dt;if(particles[i].life<=0)particles.splice(i,1)}updateHud();drawBg();for(i=0;i<objs.length;i++)drawObj(objs[i]);for(i=0;i<particles.length;i++){ctx.globalAlpha=Math.max(0,particles[i].life*2);ctx.fillStyle='#fff';ctx.fillRect(particles[i].x,particles[i].y,3,3)}ctx.globalAlpha=1;drawPlayer();requestAnimationFrame(loop)}resize();reset();drawBg();drawPlayer();addEventListener('resize',resize);$('#startBtn').onclick=startGame;$('#retryBtn').onclick=startGame;$('#againBtn').onclick=startGame;$('#jumpBtn').addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();jump()});c.addEventListener('pointerdown',function(e){e.preventDefault();jump()});addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}})})();</script></body></html>
