<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>限界リーマン純</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;background:#e8e4da;color:#111;overflow:hidden}#g{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px;pointer-events:none}.row{display:flex;justify-content:space-between;align-items:end;font-weight:900}.small{font-size:10px;color:#666}.progress{height:9px;border:2px solid #111;background:#fff;margin-top:6px}.prog{height:100%;background:#111;width:0}.bar{height:12px;border:2px solid #111;background:#fff;margin-top:4px}.fill{height:100%;width:20%;background:#111}.ov{position:fixed;inset:0;background:rgba(244,241,232,.97);display:grid;place-items:center;padding:24px;z-index:5}.card{width:min(420px,100%);border:3px solid #111;background:#fffdf7;padding:28px 22px;text-align:center;box-shadow:8px 8px 0 #111}h1{font-size:40px;line-height:1.05;margin:8px 0}p{line-height:1.7;color:#666}button{width:100%;padding:16px;border:0;background:#111;color:white;font-size:20px;font-weight:900}.hide{display:none}.msg{position:fixed;top:23%;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;font-weight:900;opacity:0;white-space:nowrap;z-index:3}.show{opacity:1}.stageflash{position:fixed;inset:0;display:grid;place-items:center;background:#111;color:#fff;z-index:4;text-align:center}.stageflash.hide{display:none}.stageflash b{font-size:38px}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="row"><div><div class="small" id="clock">MONDAY AM 6:34</div><span id="stage">STAGE 1 通勤地獄</span></div><div style="text-align:right"><div class="small">ゴールまで</div><span id="remain">900</span> m</div></div><div class="progress"><div id="prog" class="prog"></div></div><div style="margin-top:7px"><div class="row" style="font-size:11px"><span>純の限界度</span><span id="stressT">20%</span></div><div class="bar"><div id="fill" class="fill"></div></div></div></div><div id="msg" class="msg"></div><div id="flash" class="stageflash hide"><div><div class="small" style="color:#aaa">STAGE CLEAR</div><b id="flashT"></b><p id="flashP" style="color:#ddd"></p></div></div><div id="start" class="ov"><div class="card"><div class="small">SALARYMAN SURVIVAL</div><h1>限界リーマン純</h1><p>通勤、仕事、残業。<br>3つの地獄を飛び越えて退勤せよ。</p><button id="startB" type="button">出社する</button><p class="small">画面タップ：ジャンプ　有給：無敵</p></div></div><div id="over" class="ov hide"><div class="card"><div class="small">GAME OVER</div><h1>純、限界。</h1><p id="overP"></p><button id="retry" type="button">翌日も出社する</button></div></div><div id="win" class="ov hide"><div class="card"><div class="small">ALL CLEAR</div><h1>純、退勤。</h1><p>今日も一日、生き延びた。<br>明日は明日の会議がある。</p><button id="again" type="button">また月曜日</button></div></div><script>(() => {
  const $ = (s) => document.querySelector(s);
  const canvas = $('#g');
  const ctx = canvas.getContext('2d');
  const stageEl = $('#stage');
  const remainEl = $('#remain');
  const progEl = $('#prog');
  const stressFill = $('#fill');
  const stressText = $('#stressT');
  const messageEl = $('#msg');
  const startOverlay = $('#start');
  const overOverlay = $('#over');
  const winOverlay = $('#win');
  const flash = $('#flash');
  let W = 0, H = 0, dpr = 1;
  let player, obstacles = [];
  let running = false, transition = false;
  let last = 0, spawnTimer = 0, speed = 270;
  let stress = 20, stageIndex = 0, distance = 0, invincible = 0;
  const stages = [
    {name:'通勤地獄', goal:900, clock:'MONDAY AM 6:34', bg:'#e9e5db', clear:'無事、出社してしまった。', types:[
      {icon:'🚃', label:'満員電車', w:160, h:54, damage:18, kind:'train'},
      {icon:'🚉', label:'改札ラッシュ', w:50, h:58, damage:16},
      {icon:'👥', label:'人、人、人。', w:62, h:66, damage:18},
      {icon:'💼', label:'忘れ物：PC', w:44, h:44, damage:14}
    ]},
    {name:'勤務地獄', goal:1100, clock:'MONDAY AM 9:03', bg:'#eeeae1', clear:'定時という概念を発見。', types:[
      {icon:'👔', label:'部長「ちょっといい？」', w:78, h:118, damage:28, kind:'boss'},
      {icon:'📊', label:'謎のExcel', w:50, h:50, damage:20},
      {icon:'🪑', label:'会議が長い', w:140, h:46, damage:22, kind:'desk'},
      {icon:'🖨️', label:'紙詰まり', w:52, h:58, damage:18},
      {icon:'💬', label:'未読99+', w:48, h:48, damage:20}
    ]},
    {name:'残業地獄', goal:1250, clock:'MONDAY PM 8:47', bg:'#d7d4cf', clear:'', types:[
      {icon:'👔', label:'部長、まだいる。', w:90, h:145, damage:32, kind:'boss'},
      {icon:'🕘', label:'緊急対応', w:52, h:62, damage:24},
      {icon:'📚', label:'タスクの山', w:76, h:82, damage:26},
      {icon:'💬', label:'至急お願いします', w:48, h:48, damage:22},
      {icon:'🪑', label:'終わらない会議', w:150, h:46, damage:25, kind:'desk'}
    ]}
  ];
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function groundY(){ return H * 0.79; }
  function resetGame(){
    stageIndex = 0; stress = 20; distance = 0; invincible = 0; transition = false;
    obstacles = []; spawnTimer = 0.9; speed = 270;
    player = {x:65, y:groundY()-62, vy:0, w:28, h:62, onGround:true};
    updateUI();
  }
  function updateUI(){
    const s = stages[stageIndex];
    stageEl.textContent = `STAGE ${stageIndex+1} ${s.name}`;
    $('#clock').textContent = s.clock;
    remainEl.textContent = Math.max(0, Math.ceil(s.goal - distance));
    progEl.style.width = `${Math.min(100, distance / s.goal * 100)}%`;
    stressText.textContent = `${Math.round(stress)}%`;
    stressFill.style.width = `${Math.min(100, stress)}%`;
  }
  function startGame(){
    resetGame(); running = true;
    startOverlay.classList.add('hide'); overOverlay.classList.add('hide'); winOverlay.classList.add('hide');
    last = performance.now(); requestAnimationFrame(loop);
  }
  function jump(){ if(running && !transition && player.onGround){ player.vy = -790; player.onGround = false; } }
  function say(text){
    messageEl.textContent = text; messageEl.classList.add('show');
    clearTimeout(say.timer); say.timer = setTimeout(() => messageEl.classList.remove('show'), 700);
  }
  function collides(a,b){ return a.x+5 < b.x+b.w && a.x+a.w-5 > b.x && a.y+4 < b.y+b.h && a.y+a.h-3 > b.y; }
  function gameOver(){
    running = false;
    $('#overP').innerHTML = `STAGE ${stageIndex+1}「${stages[stageIndex].name}」で心が折れた。<br>ゴールまで <b>${Math.ceil(stages[stageIndex].goal-distance)}m</b>`;
    setTimeout(() => overOverlay.classList.remove('hide'), 180);
  }
  function nextStage(){
    transition = true; flash.classList.remove('hide');
    $('#flashT').textContent = `STAGE ${stageIndex+1} CLEAR`;
    $('#flashP').textContent = stages[stageIndex].clear;
    setTimeout(() => {
      stageIndex += 1;
      if(stageIndex >= stages.length){ running = false; flash.classList.add('hide'); winOverlay.classList.remove('hide'); return; }
      distance = 0; obstacles = []; spawnTimer = 0.8; stress = Math.max(15, stress-15); speed = 290 + stageIndex*25;
      player.y = groundY()-player.h; player.vy = 0; player.onGround = true;
      transition = false; flash.classList.add('hide'); updateUI();
    }, 1500);
  }
  function spawnOne(){
    if(Math.random() < 0.08){ obstacles.push({x:W+30, y:groundY()-45, w:45, h:45, type:{icon:'🏖️', label:'有給取得！', damage:0, kind:'paid'}, hit:false}); return; }
    const pool = stages[stageIndex].types;
    const type = pool[Math.floor(Math.random()*pool.length)];
    obstacles.push({x:W+20, y:groundY()-type.h, w:type.w, h:type.h, type, hit:false});
  }
  function drawBackground(){
    const s = stages[stageIndex]; ctx.fillStyle = s.bg; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = stageIndex===2 ? '#999' : '#c9c5bd';
    for(let i=0;i<7;i++){ const bx=i*95-(distance*2%95); ctx.fillRect(bx,groundY()-125,65,125); }
    ctx.strokeStyle='#111'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,groundY()); ctx.lineTo(W,groundY()); ctx.stroke();
    ctx.fillStyle='#666'; ctx.font='700 12px sans-serif';
    ctx.fillText(stageIndex===0?'会社まで走れ。':stageIndex===1?'定時まで耐えろ。':'退勤まで、あと少し（たぶん）。',16,H-22);
  }
  function drawPlayer(){
    const q=player.x+player.w/2, y=player.y; ctx.save();
    if(invincible>0 && Math.floor(invincible*12)%2===0) ctx.globalAlpha=.25;
    ctx.strokeStyle='#111'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(q,y+10,9,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(q,y+20); ctx.lineTo(q,y+43); ctx.moveTo(q,y+28); ctx.lineTo(q-13,y+35); ctx.moveTo(q,y+28); ctx.lineTo(q+13,y+33); ctx.moveTo(q,y+43); ctx.lineTo(q-11,y+60); ctx.moveTo(q,y+43); ctx.lineTo(q+12,y+60); ctx.stroke(); ctx.restore();
  }
  function drawObstacle(o){
    ctx.save(); if(o.hit) ctx.globalAlpha=.35;
    if(o.type.kind==='train'){
      ctx.fillStyle='#555'; ctx.fillRect(o.x,o.y+8,o.w,o.h-8); ctx.fillStyle='#eee';
      for(let z=8; z<o.w-10; z+=25) ctx.fillRect(o.x+z,o.y+15,14,15);
      ctx.font='20px serif'; ctx.fillText('🚃',o.x+5,o.y+28);
    } else if(o.type.kind==='boss'){
      ctx.font=`${Math.min(o.w,o.h*.62)}px serif`; ctx.fillText('👔',o.x,o.y+o.h*.65); ctx.fillStyle='#111'; ctx.font='900 10px sans-serif'; ctx.fillText('上司',o.x+8,o.y+o.h-5);
    } else if(o.type.kind==='desk'){
      ctx.fillStyle='#222'; ctx.fillRect(o.x,o.y+8,o.w,12); ctx.fillRect(o.x+8,o.y+20,7,o.h-20); ctx.fillRect(o.x+o.w-15,o.y+20,7,o.h-20); ctx.font='22px serif'; ctx.fillText('🪑',o.x+o.w*.42,o.y+10);
    } else {
      ctx.font=`${Math.min(o.w,o.h)-4}px serif`; ctx.fillText(o.type.icon,o.x,o.y+o.h-3);
    }
    ctx.restore();
  }
  function loop(now){
    if(!running) return;
    const dt = Math.min((now-last)/1000, .032); last = now;
    if(!transition){
      speed = Math.min(560, 270 + stageIndex*35 + distance*.035); distance += dt*speed/13; invincible=Math.max(0,invincible-dt);
      player.vy += 1950*dt; player.y += player.vy*dt;
      if(player.y >= groundY()-player.h){ player.y=groundY()-player.h; player.vy=0; player.onGround=true; }
      spawnTimer -= dt;
      if(spawnTimer<=0){ spawnOne(); spawnTimer=Math.max(.72,1.35-stageIndex*.12-distance*.00025)+Math.random()*.55; }
      for(const o of obstacles){
        o.x -= speed*dt;
        if(!o.hit && collides(player,o)){
          o.hit=true;
          if(o.type.kind==='paid'){ invincible=4; say('有給！ 4秒だけ無敵'); }
          else if(invincible<=0){ stress += o.type.damage; say(o.type.label); if(stress>=100){ stress=100; updateUI(); gameOver(); return; } }
        }
      }
      obstacles=obstacles.filter(o=>o.x+o.w>-30);
      if(distance>=stages[stageIndex].goal) nextStage();
    }
    updateUI(); drawBackground(); obstacles.forEach(drawObstacle); drawPlayer(); requestAnimationFrame(loop);
  }
  resize(); resetGame(); drawBackground(); drawPlayer();
  window.addEventListener('resize', () => { resize(); if(!running){ resetGame(); drawBackground(); drawPlayer(); } });
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
  $('#startB').addEventListener('click', startGame);
  $('#retry').addEventListener('click', startGame);
  $('#again').addEventListener('click', startGame);
})();</script></body></html>
