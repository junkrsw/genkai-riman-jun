<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>限界リーマン純</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071426;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}body{touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100dvh}.hud{position:fixed;z-index:4;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 6px) 8px 0;pointer-events:none}.top{display:flex;gap:8px;align-items:center;background:rgba(3,18,38,.92);border:2px solid #53d6ff;border-radius:10px;padding:6px 8px}.mini{width:34px;height:34px;border-radius:50%;border:2px solid #fff;object-fit:cover}.stat{flex:1}.line{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:11px}.stage{color:#ffd52b;font-size:14px}.meter,.prog,.bossbar{height:9px;border:1px solid #fff;background:#17324d;overflow:hidden;border-radius:6px}.meter i,.prog i,.bossbar i{display:block;height:100%;background:linear-gradient(90deg,#40ef67,#ffe436,#ff4638)}.prog i{background:#33dfff}.bossHud{position:fixed;z-index:4;top:86px;right:10px;width:min(240px,52vw);background:rgba(18,8,10,.92);border:2px solid #ff603d;border-radius:9px;padding:6px 8px;pointer-events:none}.bossHud.hide{display:none}.bossName{font-weight:1000;font-size:12px;color:#ffd6c9}.bossbar i{background:#ff352f}.toast{position:fixed;z-index:7;top:24%;left:50%;transform:translateX(-50%);background:#fff;color:#071426;border:3px solid #071426;padding:7px 12px;border-radius:8px;font-weight:1000;opacity:0}.toast.on{opacity:1}.controls{position:fixed;z-index:6;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}.controls button{pointer-events:auto;border:3px solid #001b35;border-radius:50%;width:72px;height:72px;font-size:13px;font-weight:1000;color:#071426;box-shadow:0 5px 0 #00152c}.jump{background:#ffd52b}.shoot{background:#64e7ff}.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,rgba(18,86,140,.96),rgba(2,13,28,.99) 65%)}.overlay.hide,.stageclear.hide{display:none}.card{width:min(460px,100%);background:#092443;border:4px solid #fff;border-radius:16px;padding:22px;text-align:center;box-shadow:8px 8px 0 #00152c}.logo{font-weight:1000;font-size:clamp(38px,12vw,62px);line-height:.95;text-shadow:4px 4px 0 #001,6px 6px 0 #ff9800}.logo b{color:#ffd52b}.card p{line-height:1.7;color:#d9ecff}.card button{width:100%;padding:14px;border:3px solid #001b35;border-radius:10px;background:#ffd52b;font-size:20px;font-weight:1000}.help{font-size:11px;color:#9bcfe9;margin-top:10px}.stageclear{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:rgba(1,11,26,.9);text-align:center}.stageclear strong{font-size:42px;color:#ffd52b;text-shadow:4px 4px 0 #e84b00}.stageclear p{font-weight:900}@media(max-width:430px){.bossHud{top:80px}.controls button{width:64px;height:64px}}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><img id="miniFace" class="mini" src="normal_face.jpg"><div class="stat"><div class="line"><span id="stageName" class="stage"></span><span id="mentalText"></span></div><div class="meter"><i id="mentalBar"></i></div><div class="line" style="margin-top:4px"><span id="goalLabel"></span><span id="distance"></span></div><div class="prog"><i id="progressBar"></i></div></div></div></div><div id="bossHud" class="bossHud hide"><div class="bossName">部長 アシザワ　「逃げてもムダだよ！」</div><div class="bossbar"><i id="bossBar"></i></div></div><div id="toast" class="toast"></div><div class="controls"><button id="jumpBtn" class="jump">JUMP<br>▲</button><button id="shootBtn" class="shoot">SHOT<br>●</button></div><div id="start" class="overlay"><div class="card"><div class="help">SALARYMAN SURVIVAL SHOOTING</div><div class="logo">限界リーマン<br><b>純</b></div><p>通勤・仕事・残業。<br>芦沢の「よりそう弾」を避け、撃ち返して退勤せよ。</p><button id="startBtn">出社する ▶</button><div class="help">JUMP：二段ジャンプ　SHOT：反撃<br>PC：SPACE / F</div></div></div><div id="stageClear" class="stageclear hide"><div><strong id="clearTitle"></strong><p id="clearText"></p></div></div><div id="over" class="overlay hide"><div class="card"><div class="help">GAME OVER</div><div class="logo">純、<b>限界。</b></div><p id="overText"></p><button id="retryBtn">翌日も出社する</button></div></div><div id="win" class="overlay hide"><div class="card"><div class="help">ALL CLEAR</div><div class="logo">純、<b>退勤。</b></div><p>アシザワを振り切った。<br>今日も、よく走った。</p><button id="againBtn">また月曜日</button></div></div><script>(function(){'use strict';var $=function(s){return document.querySelector(s)},c=$('#game'),ctx=c.getContext('2d'),normal=new Image(),jumpFace=new Image();normal.src='normal_face.jpg';jumpFace.src='jump_face.jpg';var W=0,H=0,DPR=1,last=0,running=false,transition=false,stage=0,dist=0,mental=20,speed=290,spawn=.8,inv=0,player,objs=[],enemyBullets=[],shots=[],particles=[],boss=null,shotCd=0,bossCd=0,toastT=0;var chars=['よ','り','そ','う'];var ST=[{name:'🚃 通勤地獄',goal:900,label:'会社まで',sky1:'#8fdcff',sky2:'#dff7ff',base:290,clear:'無事、出社してしまった。',types:[['train','長い電車',190,55,18],['crowd','満員です',64,64,16],['gate','改札ラッシュ',48,56,15],['bag','PC忘れた',42,42,13]]},{name:'🏢 勤務地獄',goal:1100,label:'定時まで',sky1:'#bddfff',sky2:'#eef7ff',base:320,clear:'芦沢を退けた。だが残業は残った。',types:[['desk','終わらない会議',150,48,20],['excel','謎のExcel',50,50,18],['printer','紙詰まり',58,62,18],['mail','未読99+',50,50,18]]},{name:'🌙 残業地獄',goal:1250,label:'退勤まで',sky1:'#071936',sky2:'#194f77',base:350,clear:'',types:[['tasks','タスクの山',80,90,25],['clock','緊急対応',58,58,22],['desk','終わらない会議',165,50,24],['mail','至急お願いします',52,52,22]]}];function gy(){return H*.79}function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(player&&!running)player.y=gy()-player.h}function reset(){stage=0;dist=0;mental=20;speed=ST[0].base;spawn=.8;inv=0;objs=[];enemyBullets=[];shots=[];particles=[];boss=null;player={x:Math.max(60,W*.16),y:gy()-80,w:52,h:80,vy:0,jumps:0};updateHud()}function startGame(){reset();$('#start').classList.add('hide');$('#over').classList.add('hide');$('#win').classList.add('hide');running=true;last=performance.now();requestAnimationFrame(loop)}function jump(){if(!running||transition)return;if(player.jumps<2){player.vy=player.jumps? -690:-790;player.jumps++;burst(player.x+20,player.y+player.h,5)}}function shoot(){if(!running||transition||shotCd>0)return;shotCd=.22;shots.push({x:player.x+48,y:player.y+30,vx:650,w:20,h:8});burst(player.x+50,player.y+32,3)}function say(t){$('#toast').textContent=t;$('#toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){$('#toast').classList.remove('on')},650)}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function burst(x,y,n){for(var i=0;i<n;i++)particles.push({x:x,y:y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*140,life:.35+Math.random()*.3})}function spawnObj(){var s=ST[stage],r=Math.random();if(r<.07){objs.push({kind:'paid',label:'有給！',x:W+20,y:gy()-110,w:48,h:48,item:1});return}if(r<.13){objs.push({kind:'coffee',label:'コーヒー',x:W+20,y:gy()-140,w:44,h:44,item:1});return}var a=s.types[Math.floor(Math.random()*s.types.length)],air=a[0]==='mail';objs.push({kind:a[0],label:a[1],x:W+20,y:air?gy()-155:gy()-a[3],w:a[2],h:a[3],damage:a[4],hit:0})}function startBoss(){if(boss)return;boss={x:W-92,y:gy()-145,w:82,h:145,hp:stage===0?55:stage===1?85:120,max:stage===0?55:stage===1?85:120};bossCd=.4;$('#bossHud').classList.remove('hide');say('部長アシザワ、出現！')}function fireBoss(){if(!boss)return;var patterns=stage===2?3:2;for(var i=0;i<patterns;i++){var y=gy()-55-i*48+(Math.random()*22-11);enemyBullets.push({x:boss.x-12,y:y,vx:-(330+stage*55+Math.random()*80),vy:stage===2?(Math.random()-.5)*35:0,w:34,h:34,ch:chars[(enemyBullets.length+i)%4]})}say('アシザワ「よりそう！！」')}function updateHud(){var s=ST[stage];$('#stageName').textContent='STAGE '+(stage+1)+'  '+s.name;$('#mentalText').textContent='限界度 '+Math.round(mental)+'%';$('#mentalBar').style.width=Math.min(100,mental)+'%';$('#goalLabel').textContent=s.label;$('#distance').textContent=Math.max(0,Math.ceil(s.goal-dist))+'m';$('#progressBar').style.width=Math.min(100,dist/s.goal*100)+'%';if(boss)$('#bossBar').style.width=Math.max(0,boss.hp/boss.max*100)+'%'}function end(){running=false;$('#overText').innerHTML='STAGE '+(stage+1)+'で心が折れた。<br>ゴールまで <b>'+Math.ceil(Math.max(0,ST[stage].goal-dist))+'m</b>';setTimeout(function(){$('#over').classList.remove('hide')},150)}function clearStage(){transition=true;$('#stageClear').classList.remove('hide');$('#clearTitle').textContent='STAGE '+(stage+1)+' CLEAR!';$('#clearText').textContent=ST[stage].clear;$('#bossHud').classList.add('hide');setTimeout(function(){stage++;if(stage>=ST.length){running=false;$('#stageClear').classList.add('hide');$('#win').classList.remove('hide');return}dist=0;mental=Math.max(12,mental-16);speed=ST[stage].base;spawn=.8;objs=[];enemyBullets=[];shots=[];boss=null;player.y=gy()-player.h;player.vy=0;player.jumps=0;transition=false;$('#stageClear').classList.add('hide');updateHud()},1400)}function drawBg(){var s=ST[stage],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,s.sky1);g.addColorStop(1,s.sky2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(stage===0){ctx.fillStyle='rgba(35,90,130,.3)';for(var i=0;i<8;i++){var bx=i*115-(dist*2%115),bh=90+i%3*30;ctx.fillRect(bx,gy()-bh,72,bh)}ctx.fillStyle='#aabdc8';ctx.fillRect(0,gy()-18,W,18)}else{ctx.fillStyle=stage===2?'#19243a':'#d5e2e9';for(var j=-1;j<8;j++){var ox=j*105-(dist*2%105);ctx.fillRect(ox,gy()-160,78,160);ctx.fillStyle=stage===2?'#ffd85d':'#80b6d5';ctx.fillRect(ox+12,gy()-140,20,24);ctx.fillRect(ox+45,gy()-140,20,24);ctx.fillStyle=stage===2?'#19243a':'#d5e2e9'}}ctx.fillStyle=stage===2?'#161b27':'#31475d';ctx.fillRect(0,gy(),W,H-gy())}function drawPlayer(){ctx.save();var img=player.jumps?jumpFace:normal;ctx.fillStyle='#101c2c';ctx.fillRect(player.x+15,player.y+35,24,38);ctx.fillStyle='#102d5a';ctx.fillRect(player.x+11,player.y+43,32,26);ctx.strokeStyle='#071426';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(player.x+19,player.y+70);ctx.lineTo(player.x+8,player.y+82);ctx.moveTo(player.x+35,player.y+70);ctx.lineTo(player.x+47,player.y+82);ctx.stroke();ctx.beginPath();ctx.arc(player.x+26,player.y+25,24,0,Math.PI*2);ctx.clip();if(img.complete)ctx.drawImage(img,player.x-2,player.y-8,58,72);ctx.restore()}function drawObj(o){ctx.save();if(o.hit)ctx.globalAlpha=.35;ctx.font=Math.min(44,o.h-2)+'px serif';var e={train:'🚃',crowd:'👥',gate:'🚉',bag:'💼',desk:'🪑',excel:'📊',printer:'🖨️',mail:'✉️',tasks:'📚',clock:'🕘',paid:'🏝️',coffee:'☕'}[o.kind]||'■';if(o.kind==='train'){ctx.fillStyle='#657887';ctx.fillRect(o.x,o.y+10,o.w,o.h-10);for(var z=10;z<o.w-18;z+=34){ctx.fillStyle='#bfe4ff';ctx.fillRect(o.x+z,o.y+18,22,17)}}else{ctx.fillText(e,o.x,o.y+o.h-3)}ctx.restore()}function drawBoss(){if(!boss)return;ctx.fillStyle='#511b17';ctx.fillRect(boss.x+20,boss.y+50,52,90);ctx.fillStyle='#121b2b';ctx.fillRect(boss.x+8,boss.y+62,70,78);ctx.fillStyle='#fff';ctx.font='1000 12px sans-serif';ctx.fillText('アシザワ',boss.x+12,boss.y+10);ctx.font='52px serif';ctx.fillText('😡',boss.x+14,boss.y+58);ctx.fillStyle='#333';ctx.fillRect(boss.x-28,boss.y+82,45,22);ctx.fillRect(boss.x-38,boss.y+88,18,10)}function loop(n){if(!running)return;var dt=Math.min((n-last)/1000,.032);last=n;shotCd=Math.max(0,shotCd-dt);if(!transition){speed=Math.min(560,ST[stage].base+dist*.025);dist+=dt*speed/14;inv=Math.max(0,inv-dt);player.vy+=1950*dt;player.y+=player.vy*dt;if(player.y>=gy()-player.h){player.y=gy()-player.h;player.vy=0;player.jumps=0}spawn-=dt;if(spawn<=0&&!boss){spawnObj();spawn=.85+Math.random()*.65}if(dist>ST[stage].goal*.72)startBoss();for(var i=objs.length-1;i>=0;i--){var o=objs[i];o.x-=speed*dt;if(!o.hit&&hit(player,o)){o.hit=1;if(o.item){if(o.kind==='paid'){inv=4;say('有給！ 4秒無敵')}else{mental=Math.max(0,mental-22);say('コーヒーで回復')}}else if(inv<=0){mental+=o.damage;say(o.label);if(mental>=100){mental=100;updateHud();end();return}}}if(o.x+o.w<0)objs.splice(i,1)}if(boss){bossCd-=dt;if(bossCd<=0){fireBoss();bossCd=Math.max(.55,1.15-stage*.2)+Math.random()*.45}for(i=enemyBullets.length-1;i>=0;i--){var eb=enemyBullets[i];eb.x+=eb.vx*dt;eb.y+=eb.vy*dt;if(inv<=0&&hit(player,eb)){enemyBullets.splice(i,1);mental+=12+stage*3;say('「'+eb.ch+'」被弾！');if(mental>=100){mental=100;updateHud();end();return}}else if(eb.x<-50)enemyBullets.splice(i,1)}for(i=shots.length-1;i>=0;i--){var sh=shots[i];sh.x+=sh.vx*dt;var removed=false;for(var k=enemyBullets.length-1;k>=0;k--){if(hit(sh,enemyBullets[k])){enemyBullets.splice(k,1);shots.splice(i,1);burst(sh.x,sh.y,5);removed=true;break}}if(removed)continue;if(hit(sh,boss)){boss.hp-=10;shots.splice(i,1);burst(boss.x,boss.y+70,7);if(boss.hp<=0){boss=null;enemyBullets=[];$('#bossHud').classList.add('hide');say('アシザワ撃破！');dist=Math.max(dist,ST[stage].goal-.5)}}else if(sh.x>W+50)shots.splice(i,1)}}if(dist>=ST[stage].goal&&(!boss||boss.hp<=0))clearStage()}for(i=particles.length-1;i>=0;i--){var p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)particles.splice(i,1)}updateHud();drawBg();for(i=0;i<objs.length;i++)drawObj(objs[i]);ctx.font='1000 29px sans-serif';for(i=0;i<enemyBullets.length;i++){var b=enemyBullets[i];ctx.fillStyle='#fff4d0';ctx.strokeStyle=stage===2?'#ff4d22':'#c74dff';ctx.lineWidth=5;ctx.strokeText(b.ch,b.x,b.y+28);ctx.fillText(b.ch,b.x,b.y+28)}ctx.fillStyle='#54e8ff';for(i=0;i<shots.length;i++){ctx.fillRect(shots[i].x,shots[i].y,shots[i].w,shots[i].h)}drawBoss();drawPlayer();ctx.fillStyle='#ffd82e';for(i=0;i<particles.length;i++){ctx.globalAlpha=Math.max(0,particles[i].life*2);ctx.fillRect(particles[i].x,particles[i].y,3,3)}ctx.globalAlpha=1;requestAnimationFrame(loop)}resize();reset();drawBg();drawPlayer();addEventListener('resize',resize);$('#startBtn').onclick=startGame;$('#retryBtn').onclick=startGame;$('#againBtn').onclick=startGame;$('#jumpBtn').addEventListener('pointerdown',function(e){e.preventDefault();jump()});$('#shootBtn').addEventListener('pointerdown',function(e){e.preventDefault();shoot()});c.addEventListener('pointerdown',function(e){e.preventDefault();jump()});addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.code==='KeyF'||e.code==='KeyX'){e.preventDefault();shoot()}})})();</script></body></html>
