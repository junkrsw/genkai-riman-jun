<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>限界リーマン純</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;background:#e8e4da;color:#111;overflow:hidden}#g{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px;pointer-events:none}.row{display:flex;justify-content:space-between;align-items:end;font-weight:900}.small{font-size:10px;color:#666}.progress{height:9px;border:2px solid #111;background:#fff;margin-top:6px}.prog{height:100%;background:#111;width:0}.bar{height:12px;border:2px solid #111;background:#fff;margin-top:4px}.fill{height:100%;width:20%;background:#111}.ov{position:fixed;inset:0;background:rgba(244,241,232,.97);display:grid;place-items:center;padding:24px;z-index:5}.card{width:min(420px,100%);border:3px solid #111;background:#fffdf7;padding:28px 22px;text-align:center;box-shadow:8px 8px 0 #111}h1{font-size:40px;line-height:1.05;margin:8px 0}h2{font-size:28px;margin:8px 0}p{line-height:1.7;color:#666}button{width:100%;padding:16px;border:0;background:#111;color:white;font-size:20px;font-weight:900}.hide{display:none}.msg{position:fixed;top:23%;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;font-weight:900;opacity:0;white-space:nowrap;z-index:3}.show{opacity:1}.stageflash{position:fixed;inset:0;display:grid;place-items:center;background:#111;color:#fff;z-index:4;text-align:center}.stageflash.hide{display:none}.stageflash b{font-size:38px}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="row"><div><div class="small" id="clock">MONDAY AM 6:34</div><span id="stage">STAGE 1 通勤地獄</span></div><div style="text-align:right"><div class="small">ゴールまで</div><span id="remain">1000</span> m</div></div><div class="progress"><div id="prog" class="prog"></div></div><div style="margin-top:7px"><div class="row" style="font-size:11px"><span>純の限界度</span><span id="stressT">20%</span></div><div class="bar"><div id="fill" class="fill"></div></div></div></div><div id="msg" class="msg"></div><div id="flash" class="stageflash hide"><div><div class="small" style="color:#aaa">STAGE CLEAR</div><b id="flashT"></b><p id="flashP" style="color:#ddd"></p></div></div><div id="start" class="ov"><div class="card"><div class="small">SALARYMAN SURVIVAL</div><h1>限界リーマン純</h1><p>通勤、仕事、残業。<br>3つの地獄を飛び越えて退勤せよ。</p><button id="startB">出社する</button><p class="small">画面タップ：ジャンプ　有給：無敵</p></div></div><div id="over" class="ov hide"><div class="card"><div class="small">GAME OVER</div><h1>純、限界。</h1><p id="overP"></p><button id="retry">翌日も出社する</button></div></div><div id="win" class="ov hide"><div class="card"><div class="small">ALL CLEAR</div><h1>純、退勤。</h1><p>今日も一日、生き延びた。<br>明日は明日の会議がある。</p><button id="again">また月曜日</button></div></div><script>(()=>{const $=s=>document.querySelector(s),c=$('#g'),x=c.getContext('2d'),ST=$('#stage'),R=$('#remain'),P=$('#prog'),F=$('#fill'),T=$('#stressT'),M=$('#msg'),A=$('#start'),O=$('#over'),WIN=$('#win'),FL=$('#flash');let W,H,dpr,player,obs,running=false,last=0,spawn=0,spd=270,stress=20,stage=0,dist=0,inv=0,transition=false;const stages=[{name:'通勤地獄',goal:900,clock:'MONDAY AM 6:34',bg:'#e9e5db',clear:'無事、出社してしまった。',types:[['🚃','満員電車',90,52,18,'train'],['🚉','改札ラッシュ',45,55,16],['👥','人、人、人。',58,62,18],['💼','忘れ物：PC',42,42,14]]},{name:'勤務地獄',goal:1100,clock:'MONDAY AM 9:03',bg:'#eeeae1',clear:'定時という概念を発見。',types:[['👔','部長「ちょっといい？」',68,110,28,'boss'],['📊','謎のExcel',48,48,20],['🪑','会議が長い',115,45,22,'desk'],['🖨️','紙詰まり',50,55,18],['💬','未読99+',46,46,20]]},{name:'残業地獄',goal:1250,clock:'MONDAY PM 8:47',bg:'#d7d4cf',clear:'',types:[['👔','部長、まだいる。',78,135,32,'boss'],['🕘','緊急対応',50,60,24],['📚','タスクの山',72,80,26],['💬','至急お願いします',46,46,22],['🪑','終わらない会議',130,45,25,'desk']]}];function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}function ground(){return H*.79}function reset(){stage=0;stress=20;dist=0;inv=0;transition=false;player={x:65,y:ground()-62,vy:0,w:28,h:62,on:true};obs=[];spawn=.9;spd=270;ui()}function ui(){let s=stages[stage];ST.textContent='STAGE '+(stage+1)+' '+s.name;$('#clock').textContent=s.clock;R.textContent=Math.max(0,Math.ceil(s.goal-dist));P.style.width=Math.min(100,dist/s.goal*100)+'%';T.textContent=Math.round(stress)+'%';F.style.width=Math.min(100,stress)+'%'}function start(){reset();running=true;A.classList.add('hide');O.classList.add('hide');WIN.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}function jump(){if(running&&!transition&&player.on){player.vy=-790;player.on=false}}function say(q){M.textContent=q;M.classList.add('show');clearTimeout(say.z);say.z=setTimeout(()=>M.classList.remove('show'),700)}function collision(a,b){return a.x+5<b.x+b.w&&a.x+a.w-5>b.x&&a.y+4<b.y+b.h&&a.y+a.h-3>b.y}function gameover(){running=false;$('#overP').innerHTML='STAGE '+(stage+1)+'「'+stages[stage].name+'」で心が折れた。<br>ゴールまで <b>'+Math.ceil(stages[stage].goal-dist)+'m</b>';setTimeout(()=>O.classList.remove('hide'),180)}function nextStage(){transition=true;FL.classList.remove('hide');$('#flashT').textContent='STAGE '+(stage+1)+' CLEAR';$('#flashP').textContent=stages[stage].clear;setTimeout(()=>{stage++;if(stage>=stages.length){running=false;FL.classList.add('hide');WIN.classList.remove('hide');return}dist=0;obs=[];spawn=.8;stress=Math.max(15,stress-15);spd=290+stage*25;player.y=ground()-player.h;player.vy=0;player.on=true;transition=false;FL.classList.add('hide');ui()},1500)}function bg(){let s=stages[stage];x.fillStyle=s.bg;x.fillRect(0,0,W,H);if(stage===0){x.fillStyle='#bbb7ae';for(let i=0;i<6;i++){let bx=i*110-(dist*2%110);x.fillRect(bx,ground()-100,70,100)}x.fillStyle='#777';x.font='700 12px sans-serif';x.fillText('浦和 → 会社',16,H-22)}else{x.fillStyle=stage===2?'#999':'#c9c5bd';for(let i=0;i<7;i++){let bx=i*95-(dist*2%95);x.fillRect(bx,ground()-125,65,125);x.fillStyle=s.bg;x.fillRect(bx+8,ground()-110,20,18);x.fillRect(bx+37,ground()-110,20,18);x.fillStyle=stage===2?'#999':'#c9c5bd'}x.fillStyle='#666';x.font='700 12px sans-serif';x.fillText(stage===1?'定時まで耐えろ。':'退勤まで、あと少し（たぶん）。',16,H-22)}x.strokeStyle='#111';x.lineWidth=3;x.beginPath();x.moveTo(0,ground());x.lineTo(W,ground());x.stroke()}function man(){let q=player.x+player.w/2,y=player.y;x.save();if(inv>0&&Math.floor(inv*12)%2===0)x.globalAlpha=.25;x.strokeStyle='#111';x.lineWidth=4;x.lineCap='round';x.beginPath();x.arc(q,y+10,9,0,Math.PI*2);x.stroke();x.beginPath();x.moveTo(q,y+20);x.lineTo(q,y+43);x.moveTo(q,y+28);x.lineTo(q-13,y+35);x.moveTo(q,y+28);x.lineTo(q+13,y+33);x.moveTo(q,y+43);x.lineTo(q-11,y+60);x.moveTo(q,y+43);x.lineTo(q+12,y+60);x.stroke();x.restore()}function spawnOne(){let s=stages[stage];if(Math.random()<.08){obs.push({x:W+30,y:ground()-45,w:45,h:45,a:['🏖️','有給取得！',45,45,0,'paid'],hit:false});return}let a=s.types[Math.floor(Math.random()*s.types.length)];let w=a[2],h=a[3];obs.push({x:W+20,y:ground()-h,w,h,a,hit:false})}function drawObs(o){x.save();if(o.hit)x.globalAlpha=.35;if(o.a[5]==='train'){x.fillStyle='#555';x.fillRect(o.x,o.y+8,o.w,o.h-8);x.fillStyle='#eee';for(let z=8;z<o.w-10;z+=25)x.fillRect(o.x+z,o.y+15,14,15);x.fillStyle='#111';x.font='20px serif';x.fillText('🚃',o.x+5,o.y+28)}else if(o.a[5]==='boss'){x.font=Math.min(o.w,o.h*.62)+'px serif';x.fillText('👔',o.x,o.y+o.h*.65);x.fillStyle='#111';x.font='900 10px sans-serif';x.fillText('上司',o.x+8,o.y+o.h-5)}else if(o.a[5]==='desk'){x.fillStyle='#222';x.fillRect(o.x,o.y+8,o.w,12);x.fillRect(o.x+8,o.y+20,7,o.h-20);x.fillRect(o.x+o.w-15,o.y+20,7,o.h-20);x.font='22px serif';x.fillText('🪑',o.x+o.w*.42,o.y+10)}else{x.font=Math.min(o.w,o.h)-4+'px serif';x.fillText(o.a[0],o.x,o.y+o.h-3)}x.restore()}function loop(n){if(!running)return;let dt=Math.min((n-last)/1000,.032);last=n;if(!transition){spd=Math.min(560,270+stage*35+dist*.035);dist+=dt*spd/13;inv=Math.max(0,inv-dt);player.vy+=1950*dt;player.y+=player.vy*dt;if(player.y>=ground()-player.h){player.y=ground()-player.h;player.vy=0;player.on=true}spawn-=dt;if(spawn<=0){spawnOne();spawn=Math.max(.72,1.35-stage*.12-dist*.00025)+Math.random()*.55}for(const o of obs){o.x-=spd*dt;if(!o.hit&&collision(player,o)){o.hit=true;if(o.a[5]==='paid'){inv=4;say('有給！ 4秒だけ無敵');}else if(inv<=0){stress+=o.a[4];say(o.a[1]);if(stress>=100){stress=100;ui();gameover();return}}}obs=obs.filter(o=>o.x+o.w>-30);if(dist>=stages[stage].goal){nextStage()}}ui();bg();obs.forEach(drawObs);man();requestAnimationFrame(loop)}resize();reset();bg();man();addEventListener('resize',()=>{resize();if(!running){reset();bg();man()}});c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('#startB').onclick=start;$('#retry').onclick=start;$('#again').onclick=start;})();</script></body></html>
