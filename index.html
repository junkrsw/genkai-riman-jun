<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>限界リーマン純</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;background:#e8e4da;color:#111;overflow:hidden}#g{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px;pointer-events:none}.row{display:flex;justify-content:space-between;font-weight:900}.small{font-size:11px;color:#666}.bar{height:14px;border:2px solid #111;background:#fff;margin-top:5px}.fill{height:100%;width:20%;background:#111}.ov{position:fixed;inset:0;background:rgba(244,241,232,.96);display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);border:3px solid #111;background:#fffdf7;padding:28px 22px;text-align:center;box-shadow:8px 8px 0 #111}h1{font-size:42px;line-height:1;margin:8px 0}p{line-height:1.7;color:#666}button{width:100%;padding:16px;border:0;background:#111;color:white;font-size:20px;font-weight:900}.hide{display:none}.msg{position:fixed;top:24%;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;font-weight:900;opacity:0}.show{opacity:1}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="row"><div><div class="small">MONDAY AM 6:34</div>限界リーマン純</div><div style="text-align:right"><div class="small">出社距離</div><span id="score">0</span> m</div></div><div style="margin-top:10px"><div class="row" style="font-size:12px"><span>純の限界度</span><span id="stressT">20%</span></div><div class="bar"><div id="fill" class="fill"></div></div></div></div><div id="msg" class="msg">ちょっといい？</div><div id="start" class="ov"><div class="card"><div class="small">SALARYMAN SURVIVAL</div><h1>限界リーマン純</h1><p>迫りくる仕事を飛び越えろ。<br>純の心が折れる前に会社へたどり着け。</p><button id="startB">出社する</button><p class="small">画面タップ：ジャンプ</p></div></div><div id="over" class="ov hide"><div class="card"><div class="small">GAME OVER</div><h1>純、退職。</h1><p>出社距離 <b><span id="final">0</span>m</b><br>「お世話になりました。」</p><button id="retry">翌日も出社する</button></div></div><script>(()=>{const c=document.querySelector('#g'),x=c.getContext('2d'),S=document.querySelector('#score'),F=document.querySelector('#fill'),T=document.querySelector('#stressT'),M=document.querySelector('#msg'),A=document.querySelector('#start'),O=document.querySelector('#over');let W,H,dpr,p,obs,running=false,last=0,t=0,spawn=0,spd=270,score=0,stress=20;const types=[['📊','謎のExcel',24],['👔','部長「今日中で」',30],['📅','会議が追加されました',22],['💬','未読47件',18]];function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}function ground(){return H*.78}function reset(){p={x:75,y:ground()-62,vy:0,w:28,h:62,on:true};obs=[];t=score=0;spawn=.8;spd=270;stress=20;ui()}function ui(){S.textContent=Math.floor(score);T.textContent=Math.round(stress)+'%';F.style.width=stress+'%'}function start(){reset();running=true;A.classList.add('hide');O.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}function jump(){if(running&&p.on){p.vy=-760;p.on=false}}function say(q){M.textContent=q;M.classList.add('show');clearTimeout(say.z);say.z=setTimeout(()=>M.classList.remove('show'),650)}function end(){running=false;stress=100;ui();document.querySelector('#final').textContent=Math.floor(score);setTimeout(()=>O.classList.remove('hide'),180)}function collision(a,b){return a.x+6<b.x+b.w&&a.x+a.w-6>b.x&&a.y+5<b.y+b.h&&a.y+a.h-5>b.y}function bg(){x.fillStyle='#f4f1e8';x.fillRect(0,0,W,H);x.fillStyle='#ded9cf';for(let i=0;i<7;i++){let bx=i*95-(score*3%95)-30,bh=80+(i%4)*30;x.fillRect(bx,ground()-bh,55,bh)}x.strokeStyle='#111';x.lineWidth=3;x.beginPath();x.moveTo(0,ground());x.lineTo(W,ground());x.stroke();x.lineWidth=2;for(let q=-(score*5)%80;q<W;q+=80){x.beginPath();x.moveTo(q,ground()+25);x.lineTo(q+38,ground()+25);x.stroke()}x.fillStyle='#666';x.font='700 11px sans-serif';x.fillText('会社まで、まだ遠い。',16,H-22)}function man(){let q=p.x+p.w/2,y=p.y;x.strokeStyle='#111';x.lineWidth=4;x.lineCap='round';x.beginPath();x.arc(q,y+10,9,0,Math.PI*2);x.stroke();x.beginPath();x.moveTo(q,y+20);x.lineTo(q,y+43);x.moveTo(q,y+28);x.lineTo(q-13,y+35);x.moveTo(q,y+28);x.lineTo(q+13,y+33);x.moveTo(q,y+43);x.lineTo(q-11,y+60);x.moveTo(q,y+43);x.lineTo(q+12,y+60);x.stroke()}function loop(n){if(!running)return;let dt=Math.min((n-last)/1000,.032);last=n;t+=dt;spd=Math.min(520,270+t*8);score+=dt*spd/18;p.vy+=1900*dt;p.y+=p.vy*dt;if(p.y>=ground()-p.h){p.y=ground()-p.h;p.vy=0;p.on=true}spawn-=dt;if(spawn<=0){let a=types[Math.floor(Math.random()*types.length)],z=a[0]=='👔'?54:44;obs.push({x:W+20,y:ground()-z,w:z,h:z,a,hit:false});spawn=Math.max(.75,1.3-t*.008)+Math.random()*.5}for(const o of obs){o.x-=spd*dt;if(!o.hit&&collision(p,o)){o.hit=true;stress+=o.a[2];say(o.a[1]);if(stress>=100)end()}}obs=obs.filter(o=>o.x+o.w>-20);ui();bg();for(const o of obs){x.globalAlpha=o.hit?.45:1;x.font=(o.w-5)+'px serif';x.fillText(o.a[0],o.x,o.y+o.h-3)}x.globalAlpha=1;man();requestAnimationFrame(loop)}resize();reset();bg();man();addEventListener('resize',()=>{resize();if(!running){reset();bg();man()}});c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('#startB').onclick=start;document.querySelector('#retry').onclick=start;})();</script></body></html>
