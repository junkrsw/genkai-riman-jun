<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>午前0時のダイナックス</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070b;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.game{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 70% 15%,#243044 0,transparent 30%),linear-gradient(#111722,#05070b 70%);padding:18px}.top{display:flex;justify-content:space-between;color:#9ba7b8;font:12px monospace;letter-spacing:.12em}.scene{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:35px 10px;color:#9ca9bb}.monitor{border:1px solid #354155;background:#07101b;padding:22px;max-width:650px;width:100%;font:16px/1.9 monospace;box-shadow:0 0 45px #101c2b}.box{background:rgba(7,10,16,.94);border:1px solid #303846;border-radius:14px;padding:18px;max-width:820px;width:100%;margin:0 auto 10px}.speaker{font-size:12px;color:#9fb7d8;margin-bottom:8px;font-weight:bold}.text{font-size:16px;line-height:1.9;min-height:115px;white-space:pre-wrap}.choices{display:grid;gap:9px;margin-top:12px}button{border:1px solid #3a4658;background:#141b26;color:#f2f5f9;border-radius:9px;padding:13px;text-align:left;font-size:15px}button:active{background:#263246}.title{text-align:center;margin:auto;max-width:650px}.title h1{font-size:clamp(34px,8vw,64px);letter-spacing:.08em;margin:10px 0}.title p{line-height:1.8;color:#bbc3cf}.small{font-size:11px;color:#727e8e}.start{display:block;margin:25px auto 0;text-align:center;min-width:220px}.hidden{display:none}.evidence{color:#8fd6b8;font-size:12px;margin-top:8px}@media(max-width:600px){.game{padding:12px}.text{font-size:15px;min-height:150px}.scene{padding:20px 4px}.monitor{font-size:14px;padding:16px}}
</style>
</head>
<body>
<div class="game">
<div class="top"><span>FUCHU / TOKYO</span><span id="clock">23:52</span></div>
<div id="title" class="title"><div class="small">MYSTERY SOUND NOVEL / PROTOTYPE</div><h1>午前0時の<br>ダイナックス</h1><p>土曜の深夜。忘れ物を取りに戻った会社で、<br>あなたは「5分前の自分」を目撃する。</p><button class="start" id="start">はじめる</button><p class="small">本作はフィクションです。実在の人物・団体・事件とは関係ありません。</p></div>
<div id="play" class="hidden" style="flex:1;display:none;flex-direction:column">
<div class="scene" id="scene"></div>
<div class="box"><div class="speaker" id="speaker"></div><div class="text" id="text"></div><div class="evidence" id="evidence"></div><div class="choices" id="choices"></div></div>
</div>
</div>
<script>
const scenes={
intro:{v:'<div class="monitor">株式会社ダイナックス<br>府中本社 / 7F</div>',s:'',t:'土曜日、23時52分。\n東京都府中市。株式会社ダイナックス。\n\n俺が会社に戻ってきた理由は、机に家の鍵を忘れたからだった。',c:[['先へ進む','sound']]},
sound:{v:'<div class="monitor">……カタ、カタ。</div>',s:'あなた',t:'七階には誰もいないはずだった。\nだが、奥の会議室からキーボードを叩く音がする。',c:[['会議室を見る','photo'],['帰る','bad1']]},
photo:{v:'<div class="monitor">23:47　あなたはここにいた<br>CAM-07</div>',s:'',t:'会議室のモニターに防犯カメラの画像が映っている。\n\nそこにいたのは——俺だ。\n時刻は23時47分。わずか5分前。\nだがその時間、俺はまだ府中駅から会社へ歩いていた。',c:[['防犯カメラの記録を調べる','camera'],['自分の机を調べる','desk']]},
camera:{v:'<div class="monitor">SOURCE: ARCHIVE<br>DATE: 08/22 23:47</div>',s:'',t:'映像はライブではなかった。\n三週間前の映像に、今日の日付を重ねている。\n\n誰かが意図的に「今夜の俺」を作ったのだ。',e:'証拠：偽装された防犯映像',c:[['机を調べる','desk2']]},
desk:{v:'<div class="monitor">DESK 07-14<br>USB MEMORY</div>',s:'',t:'机の引き出しに、見覚えのないUSBメモリがある。\nラベルには手書きでこうある。\n\n「0:00まで開くな」',e:'証拠：謎のUSBメモリ',c:[['USBを開く','usb'],['防犯カメラを調べる','camera']]},
desk2:{v:'<div class="monitor">DESK 07-14<br>USB MEMORY</div>',s:'',t:'机の引き出しからUSBメモリを見つけた。\n「0:00まで開くな」と書かれている。',e:'証拠：謎のUSBメモリ',c:[['待たずに開く','usb'],['会社から逃げる','bad1']]},
usb:{v:'<div class="monitor">00:00<br>PLAYING MESSAGE...</div>',s:'？？？',t:'「これを見ているということは、映像の偽装に気づいたんだな」\n\nスピーカーから聞き覚えのある声が流れる。\n\n「明日の朝、ダイナックスで起きることを止めてほしい」',c:[['声の主を追う','end']]},
end:{v:'<div class="monitor">TO BE CONTINUED...</div>',s:'',t:'その瞬間、廊下の非常灯がすべて消えた。\n\n暗闇の向こうで、エレベーターが七階に止まる音がした。\n\n——チン。\n\n扉が開く。',e:'PROTOTYPE END',c:[['最初から','intro']]},
bad1:{v:'<div class="monitor">ELEVATOR ERROR<br>7F → 7F</div>',s:'',t:'帰ることにした。\nエレベーターで1階を押す。\n\nしばらくして扉が開いた。\n\n表示は——7F。\n\nそして会議室から、またキーボードの音がした。',e:'BAD END：帰れない七階',c:[['最初から','intro']]}
};
const title=document.getElementById('title'),play=document.getElementById('play'),scene=document.getElementById('scene'),speaker=document.getElementById('speaker'),text=document.getElementById('text'),choices=document.getElementById('choices'),evidence=document.getElementById('evidence');
function show(id){const x=scenes[id];scene.innerHTML=x.v;speaker.textContent=x.s;text.textContent=x.t;evidence.textContent=x.e||'';choices.innerHTML='';x.c.forEach(([label,next])=>{const b=document.createElement('button');b.textContent=label;b.addEventListener('click',()=>show(next));choices.appendChild(b)})}
document.getElementById('start').addEventListener('click',()=>{title.style.display='none';play.style.display='flex';show('intro')});
</script>
</body>
</html>
