<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>午前0時のダイナックス</title><style>
*{box-sizing:border-box}body{margin:0;background:#05070b;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.game{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 75% 10%,#243044 0,transparent 30%),linear-gradient(#101722,#05070b 72%);padding:14px}.top{display:flex;justify-content:space-between;color:#8995a6;font:11px monospace;letter-spacing:.12em}.title{text-align:center;margin:auto;max-width:700px}.title h1{font-size:clamp(36px,9vw,68px);letter-spacing:.08em;margin:12px}.title p{line-height:1.8;color:#b8c1cd}.small{font-size:11px;color:#707c8d}.start{display:block;margin:24px auto;min-width:220px;text-align:center}.play{flex:1;display:flex;flex-direction:column;max-width:900px;width:100%;margin:auto}.hud{display:flex;gap:8px;overflow:auto;padding:10px 0}.chip{white-space:nowrap;border:1px solid #344052;border-radius:99px;padding:6px 10px;color:#aab7c8;font-size:11px}.scene{flex:1;min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}.monitor{border:1px solid #354155;background:#07101b;padding:22px;max-width:680px;width:100%;font:14px/1.9 monospace;box-shadow:0 0 45px #101c2b}.box{background:rgba(7,10,16,.95);border:1px solid #303846;border-radius:14px;padding:17px}.speaker{font-size:12px;color:#9fb7d8;font-weight:bold;margin-bottom:7px}.text{font-size:15px;line-height:1.9;min-height:120px;white-space:pre-wrap}.choices{display:grid;gap:8px;margin-top:12px}button{border:1px solid #3a4658;background:#141b26;color:#f2f5f9;border-radius:9px;padding:13px;text-align:left;font-size:14px}button:active{background:#263246}.evi{color:#8fd6b8;font-size:12px;margin-top:7px}.hidden{display:none}.wrong{color:#e6a6a6}@media(max-width:600px){.game{padding:10px}.scene{min-height:150px;padding:10px}.text{min-height:150px}.monitor{padding:14px;font-size:13px}}
</style></head><body><div class="game"><div class="top"><span>FUCHU / TOKYO</span><span id="clock">SAT 23:52</span></div><div id="title" class="title"><div class="small">DEDUCTION SOUND NOVEL</div><h1>午前0時の<br>ダイナックス</h1><p>金曜の夜を最後に、ツムラシュウジが消えた。<br>全員が何かを隠している。だが、嘘つきが犯人とは限らない。</p><button id="start" class="start">捜査を始める</button><p class="small">本作はフィクションです。実在の人物・団体・事件とは関係ありません。</p></div><div id="play" class="play hidden"><div class="hud" id="hud"></div><div class="scene" id="scene"></div><div class="box"><div class="speaker" id="speaker"></div><div class="text" id="text"></div><div class="evi" id="evi"></div><div class="choices" id="choices"></div></div></div></div><script>
const E=new Set();let flags={};const add=(x)=>E.add(x);const V=(h)=>`<div class="monitor">${h}</div>`;
const S={
intro:{v:V('株式会社ダイナックス<br>府中本社 / 7F'),s:'あなた',t:'土曜、23時52分。忘れ物を取りに戻った無人のオフィス。\n\nツムラシュウジは、金曜の夜から連絡が取れない。彼のPCだけが点いていた。',c:[['ツムラのPCを見る','last']]},
last:{v:V('ANONYMOUS POST<br>FRI 22:51<br><br>「終わった。」'),s:'',t:'投稿はこれで途切れている。入退館記録では、ツムラは23:03に一人で退館。その後、消息不明。\n\n——何が「終わった」のか。',get:'22:51「終わった」',c:[['金曜夜の関係者を調べる','menu']]},
menu:{v:V('INVESTIGATION<br>金曜夜を復元せよ'),s:'あなた',t:'関係者は全員、何かを隠している。\n誰から調べる？',menu:true},
ishizu:{v:V('ISHIZU / 20:05<br>「今夜も俺だけが会社を回してる。」'),s:'イシズ',t:'「金曜？ 早く帰りましたよ」\n\nだが匿名SNSには20:05、社内デスクの写真。端には本人の社員証まで写っている。\n\n追及するとイシズは黙り込んだ。\n「……そのアカウント、社内では言わないでもらえます？」\n\n失踪とは無関係らしい。',get:'イシズのイキりSNS',done:'i',c:[['捜査に戻る','menu']]},
takako:{v:V('FRI 22:07 / 府中・町中華<br>ラーメン　チャーハン　餃子<br>レバニラ炒め　追加チャーハン'),s:'タカコ',t:'「仕事のあと？ そのまま帰りました」\n\n決済履歴を示す。\n\n「……私です」\n「これ、何人で？」\n「一人です」\n「追加チャーハンも？」\n「……はい」\n\n妙な嘘だったが、22時台に会社にいなかったことは逆に証明された。',get:'町中華のレシート',done:'t',c:[['捜査に戻る','menu']]},
shige:{v:V('SYSTEM LOG<br>21:17 WATANABE.S / ADMIN LOGIN<br>21:40 TSUMURA / NEAR SERVER AREA'),s:'あなた',t:'弟のシゲが21:17に管理者権限でシステムへ入っている。21:40ごろ、ツムラはその近くを通っていた。\n\n送金データを追うと、説明のつかない金の流れが見つかった。',c:[['シゲを問い詰める','shige2']]},
shige2:{v:V('UNAUTHORIZED TRANSFER<br>ACCOUNT: WATANABE.S'),s:'シゲ',t:'「兄貴……俺だ」\n\n「会社の金に手をつけた」\n\n横領は事実だった。しかもツムラは、その夜シゲを見ている。\n——これが失踪の理由なのか？',get:'シゲの不正送金記録',done:'s',c:[['ツムラは横領を知ったはずだ','trap'],['まだ断定できない','menu']]},
trap:{v:V('FACT ≠ ASSUMPTION'),s:'あなた',t:'……いや。ツムラが見たのは「シゲがPCを操作していたこと」だけだ。\n横領の内容まで見た証拠はない。\n\n事実と推測を混ぜるな。',get:'ツムラが横領を知った証拠はない',c:[['捜査に戻る','menu']]},
sns:{v:V('UNKNOWN ACCOUNT / 327 POSTS<br>「今日もTさんがかわいかった」<br>「餃子12個。そういうところも好きだ」<br>「Tさんと結婚したら毎日中華でもいい」'),s:'あなた',t:'ツムラの閲覧履歴から、別の匿名アカウントを見つけた。\n数か月にわたり「Tさん」への気持ちが書かれている。投稿は327件。\n\nこのTさんは誰だ？',c:[['ハシモトタカコ','sns2'],['イシズ','wrongT'],['クロサワジュン','wrongT']]},
wrongT:{v:V('推理不成立'),s:'あなた',t:'投稿には「餃子」「レバニラ」「昼飯を食べるのが速い」……。集めた情報と合わない。',c:[['考え直す','sns']]},
sns2:{v:V('T = HASHIMOTO TAKAKO'),s:'あなた',t:'Tさんはタカコだ。\nでは、この異様な量の片思い投稿を書いている人物は？',c:[['ツムラシュウジ','sns3'],['シゲ','wrongA'],['イシズ','wrongA']]},
wrongA:{v:V('推理不成立'),s:'あなた',t:'社内でのタカコの行動をここまで細かく知り、金曜22:51の「終わった。」につながる人物……。',c:[['考え直す','sns2']]},
sns3:{v:V('ACCOUNT OWNER = TSUMURA SHUJI'),s:'あなた',t:'投稿者はツムラだ。\nタカコへの片思いを、匿名SNSに延々と書き続けていた。\n\nだが、それだけでは失踪しない。誰かに知られたのか？',get:'ツムラの匿名SNS',done:'a',c:[['捜査に戻る','menu']]},
kurosawa:{v:V('BROWSER HISTORY / KUROSAWA<br>22:20 UNKNOWN ACCOUNT<br>22:31 UNKNOWN ACCOUNT<br>22:39 UNKNOWN ACCOUNT'),s:'クロサワ',t:'「……ああ。見たよ」\n\n「最初は誰だか分からなかった。でも読んでたらTがタカコで、書いてるのがツムラだって分かった」\n\n「22:43ごろ、本人にスマホ見せて聞いたんだ。『これ、お前だろ？』って」',get:'クロサワの閲覧履歴',done:'k',c:[['その後は？','kurosawa2']]},
kurosawa2:{v:V('22:43「これ、お前だろ？」<br>22:51「終わった。」<br>23:03 TSUMURA EXIT'),s:'クロサワ',t:'「顔真っ青にして、どっか行った。俺も、まさか次の日から消えるとは思わなかったよ」\n\n金曜夜の線が、一本につながり始めた。',c:[['最終推理へ','final1']]},
final1:{v:V('FINAL DEDUCTION 1/3'),s:'',t:'シゲは会社の金を横領していた。\nでは、それがツムラ失踪の直接の原因だった？',c:[['YES','fail1'],['NO','final2']]},
fail1:{v:V('推理失敗'),s:'あなた',t:'横領は事実だ。だがツムラが横領を知った証拠がない。重大な秘密に引っ張られすぎている。',c:[['最終推理をやり直す','final1']]},
final2:{v:V('FINAL DEDUCTION 2/3'),s:'',t:'ツムラは誰かによって強制的に失踪させられた？',c:[['YES','fail2'],['NO','final3']]},
fail2:{v:V('推理失敗'),s:'あなた',t:'23:03、ツムラは自分の社員証で一人で退館している。連れ出された証拠もない。',c:[['考え直す','final2']]},
final3:{v:V('FINAL DEDUCTION 3/3<br>失踪の理由を完成させろ'),s:'あなた',t:'ツムラが「終わった。」と投稿した8分前、何が起きた？',c:[['クロサワに匿名SNSを特定された','truth'],['シゲの横領を目撃した','fail3'],['タカコに振られた','fail3']]},
fail3:{v:V('推理失敗'),s:'あなた',t:'その出来事と22:51の投稿を直接つなぐ証拠がない。時刻をもう一度見ろ。',c:[['考え直す','final3']]},
truth:{v:V('DEDUCTION COMPLETE<br>22:43 → 22:51 → 23:03'),s:'あなた',t:'ツムラは事件に巻き込まれたんじゃない。\nシゲの横領を知ったからでもない。\n\nタカコへの片思いを327件も書いた匿名SNSをクロサワに特定され——恥ずかしさに耐えられず、自分から姿を消したんだ。',c:[['数日後——','ep']]},
ep:{v:V('INCOMING CALL<br>TSUMURA SHUJI'),s:'ツムラ',t:'「……会社、行かないとダメですかね」\n\n「仕事だからな」\n\n「クロサワさん、いますよね？」\n「いる」\n「タカコさんも？」\n「いる。でもタカコはSNSのこと知らないぞ」\n\n「…………本当ですか？」',c:[['それより大変なことになった','end']]},
end:{v:V('TRUE END<br>「終わった。」'),s:'あなた',t:'「シゲが会社の金を横領してた」\n\nツムラ「…………え？」\n\n深夜の失踪事件は終わった。\nそして、失踪とはまったく関係のない本物の事件だけが残った。',c:[['最初から遊ぶ','restart']]}
};
const title=document.querySelector('#title'),play=document.querySelector('#play'),scene=document.querySelector('#scene'),speaker=document.querySelector('#speaker'),text=document.querySelector('#text'),choices=document.querySelector('#choices'),evi=document.querySelector('#evi'),hud=document.querySelector('#hud');
function drawHud(){hud.innerHTML='';[...E].forEach(x=>{let d=document.createElement('div');d.className='chip';d.textContent='証拠：'+x;hud.appendChild(d)})}
function show(id){if(id==='restart'){location.reload();return}let x=S[id];if(x.get)add(x.get);if(x.done)flags[x.done]=1;drawHud();scene.innerHTML=x.v;speaker.textContent=x.s;text.textContent=x.t;evi.textContent=x.get?'《証拠を入手：'+x.get+'》':'';choices.innerHTML='';if(x.menu){let opts=[];if(!flags.i)opts.push(['イシズを調べる','ishizu']);if(!flags.t)opts.push(['タカコを調べる','takako']);if(!flags.s)opts.push(['弟・シゲを調べる','shige']);if(flags.i&&flags.t&&flags.s&&!flags.a)opts.push(['ツムラのSNS履歴を深掘りする','sns']);if(flags.a&&!flags.k)opts.push(['クロサワを調べる','kurosawa']);if(!opts.length)opts.push(['集めた証拠を整理する','final1']);x={...x,c:opts}}(x.c||[]).forEach(([l,n])=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>show(n);choices.appendChild(b)})}
document.querySelector('#start').onclick=()=>{title.style.display='none';play.classList.remove('hidden');show('intro')};
</script></body></html>
