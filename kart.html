<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>限界カート純</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071426;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}body{touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100dvh}.hud{position:fixed;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 7px) 8px 0;pointer-events:none}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:rgba(2,12,28,.88);border:2px solid #4fd7ff;border-radius:12px;padding:7px 10px;font-weight:900}.pos{font-size:26px;color:#ffd429}.small{font-size:11px;color:#c9e8ff}.stat{text-align:center}.stat b{display:block;font-size:18px}.controls{position:fixed;z-index:7;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}.pad{display:flex;gap:10px}.controls button{pointer-events:auto;border:3px solid #00162b;box-shadow:0 5px 0 #00101f;border-radius:50%;width:68px;height:68px;font-weight:1000;font-size:22px;background:#eaf6ff;color:#071426}.controls .boost{background:#ffd429;font-size:12px}.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,rgba(28,107,176,.96),rgba(2,12,27,.99) 68%)}.overlay.hide{display:none}.card{width:min(440px,100%);background:#0b2748;border:4px solid white;border-radius:18px;padding:22px;text-align:center;box-shadow:8px 8px 0 #001226}.logo{font-size:clamp(38px,11vw,60px);font-weight:1000;line-height:.95;text-shadow:4px 4px 0 #001}.logo b{color:#ffd429}.card p{line-height:1.7;color:#d9ecff}.card button{width:100%;padding:14px;border:3px solid #00162b;border-radius:10px;background:#ffd429;color:#071426;font-weight:1000;font-size:20px}.toast{position:fixed;z-index:8;top:24%;left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:8px;background:#fff;color:#071426;border:3px solid #071426;font-weight:1000;opacity:0}.toast.on{opacity:1}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="bar"><div><div class="pos" id="pos">1st</div><div class="small" id="lap">LAP 1/3</div></div><div class="stat"><span class="small">SPEED</span><b id="speed">98 km/h</b></div><div class="stat"><span class="small">COIN</span><b id="coins">0</b></div><div class="stat"><span class="small">TIME</span><b id="time">00:00.0</b></div></div></div><div id="toast" class="toast"></div><div class="controls"><div class="pad"><button id="left">◀</button><button id="right">▶</button></div><button id="boost" class="boost">BOOST<br>⚡</button></div><div id="start" class="overlay"><div class="card"><div class="small">ARCADE KART RACING</div><div class="logo">限界カート<br><b>純</b></div><p>顔がデカいほど速い。<br>左右に避けてコインを集め、3周走り切れ。</p><button id="startBtn">レース開始 ▶</button><div class="small" style="margin-top:10px">PC：← →　BOOST：SPACE</div></div></div><div id="finish" class="overlay hide"><div class="card"><div class="small">FINISH!</div><div class="logo">純、<b>1位。</b></div><p id="result"></p><button id="again">もう1レース</button></div></div><script>(function(){'use strict';var c=document.getElementById('game'),ctx=c.getContext('2d'),face=new Image();face.src='jump_face.jpg';var W=0,H=0,DPR=1,last=0,running=false,startT=0,elapsed=0,road=0,lane=0,targetLane=0,speed=98,lap=1,coins=0,distance=0,boost=0,shake=0,spawn=0,items=[],toastTimer=0;function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}function say(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.classList.remove('on')},650)}function reset(){road=0;lane=0;targetLane=0;speed=98;lap=1;coins=0;distance=0;boost=0;shake=0;spawn=.7;items=[];elapsed=0;updateHud()}function start(){reset();document.getElementById('start').classList.add('hide');document.getElementById('finish').classList.add('hide');running=true;startT=performance.now();last=startT;requestAnimationFrame(loop)}function steer(d){targetLane=Math.max(-1,Math.min(1,targetLane+d))}function doBoost(){if(!running||boost>0)return;boost=1.4;say('限界BOOST！')}function spawnItem(){var isCoin=Math.random()<.55,ln=[-1,0,1][Math.floor(Math.random()*3)];items.push({lane:ln,z:1.08,type:isCoin?'coin':'cone',hit:0})}function updateHud(){document.getElementById('lap').textContent='LAP '+lap+'/3';document.getElementById('speed').textContent=Math.round(speed)+' km/h';document.getElementById('coins').textContent=coins;var m=Math.floor(elapsed/60),s=elapsed-m*60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+s.toFixed(1).padStart(4,'0')}function project(l,z){var horizon=H*.27,bottom=H*.92,y=horizon+(bottom-horizon)*(1-z),halfTop=W*.055,halfBottom=W*.46,half=halfTop+(halfBottom-halfTop)*(1-z);return{x:W/2+l*half*.62,y:y,scale:.18+(1-z)*1.12}}function drawSky(){var g=ctx.createLinearGradient(0,0,0,H*.55);g.addColorStop(0,'#47baff');g.addColorStop(1,'#dff8ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#59bb49';ctx.fillRect(0,H*.25,W,H*.32);for(var i=0;i<12;i++){var x=(i*143-road*22)% (W+180)-80;ctx.fillStyle=i%2?'#2c8738':'#3da248';ctx.beginPath();ctx.arc(x,H*.35+(i%3)*8,36+(i%2)*14,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#fff';for(i=0;i<5;i++){var cx=(i*280+70-road*8)%(W+300)-100;ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(cx,H*.14,22,0,Math.PI*2);ctx.arc(cx+24,H*.13,30,0,Math.PI*2);ctx.arc(cx+55,H*.15,21,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}function drawRoad(){var h=H*.27,b=H*.92;ctx.fillStyle='#5e6670';ctx.beginPath();ctx.moveTo(W*.445,h);ctx.lineTo(W*.555,h);ctx.lineTo(W*.96,b);ctx.lineTo(W*.04,b);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([22,18]);for(var k=-1;k<=1;k+=2){ctx.beginPath();ctx.moveTo(W*.5+k*W*.018,h);ctx.lineTo(W*.5+k*W*.155,b);ctx.stroke()}ctx.setLineDash([]);for(var z=.08;z<1;z+=.12){var p1=project(-1.45,z),p2=project(1.45,z);ctx.strokeStyle=((Math.floor((z+road% .24)/.12))%2)?'#fff':'#ed3b36';ctx.lineWidth=5*p1.scale;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}}function drawCoin(x,y,s){ctx.fillStyle='#ffd429';ctx.strokeStyle='#a66d00';ctx.lineWidth=3*s;ctx.beginPath();ctx.arc(x,y,14*s,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff1a0';ctx.fillRect(x-2*s,y-9*s,4*s,18*s)}function drawCone(x,y,s){ctx.fillStyle='#ff632f';ctx.beginPath();ctx.moveTo(x,y-24*s);ctx.lineTo(x-18*s,y+18*s);ctx.lineTo(x+18*s,y+18*s);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-12*s,y,24*s,7*s)}function drawItems(){var arr=items.slice().sort(function(a,b){return b.z-a.z});for(var i=0;i<arr.length;i++){var it=arr[i],p=project(it.lane,it.z);if(it.type==='coin')drawCoin(p.x,p.y,p.scale);else drawCone(p.x,p.y,p.scale)}}function drawKart(){var x=W/2+lane*W*.22,y=H*.79;if(shake){x+=(Math.random()-.5)*10}ctx.save();ctx.translate(x,y);var sc=Math.min(1.15,Math.max(.8,W/390));ctx.scale(sc,sc);ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(-55,38,23,34,0,0,Math.PI*2);ctx.ellipse(55,38,23,34,0,0,Math.PI*2);ctx.ellipse(-49,-2,17,28,0,0,Math.PI*2);ctx.ellipse(49,-2,17,28,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e62e2e';ctx.strokeStyle='#671111';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect?ctx.roundRect(-48,5,96,58,18):ctx.rect(-48,5,96,58);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,38,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.font='900 24px sans-serif';ctx.textAlign='center';ctx.fillText('純',0,47);ctx.strokeStyle='#222';ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,5,29,Math.PI*.15,Math.PI*.85);ctx.stroke();if(face.complete&&face.naturalWidth){var sw=face.naturalWidth,sh=face.naturalHeight;ctx.save();ctx.beginPath();ctx.ellipse(0,-55,48,58,0,0,Math.PI*2);ctx.clip();ctx.drawImage(face,sw*.18,sh*.12,sw*.64,sh*.72,-50,-115,100,120);ctx.restore();ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,-55,48,58,0,0,Math.PI*2);ctx.stroke()}ctx.restore()}function finish(){running=false;document.getElementById('result').innerHTML='TIME <b>'+document.getElementById('time').textContent+'</b><br>COIN <b>'+coins+'</b>';setTimeout(function(){document.getElementById('finish').classList.remove('hide')},300)}function loop(now){if(!running)return;var dt=Math.min((now-last)/1000,.035);last=now;elapsed=(now-startT)/1000;lane+=(targetLane-lane)*Math.min(1,dt*7);if(boost>0){boost-=dt;speed+=(145-speed)*dt*5}else speed+=(98-speed)*dt*2.5;road+=dt*speed*.0028;distance+=dt*speed*.003;spawn-=dt;if(spawn<=0){spawnItem();spawn=.42+Math.random()*.5}for(var i=items.length-1;i>=0;i--){var it=items[i];it.z-=dt*speed*.0044;if(!it.hit&&it.z<.12&&Math.abs(it.lane-lane)<.43){it.hit=1;if(it.type==='coin'){coins++;say('COIN +1')}else{speed=58;shake=.35;say('ぶつかった！')}}if(it.z<-.08)items.splice(i,1)}shake=Math.max(0,shake-dt);if(distance>=1){distance-=1;lap++;say(lap<=3?'LAP '+lap:'FINISH!');if(lap>3){lap=3;updateHud();finish();return}}updateHud();drawSky();drawRoad();drawItems();drawKart();requestAnimationFrame(loop)}resize();drawSky();drawRoad();drawKart();addEventListener('resize',resize);document.getElementById('startBtn').onclick=start;document.getElementById('again').onclick=start;function bind(id,fn){document.getElementById(id).addEventListener('pointerdown',function(e){e.preventDefault();fn()})}bind('left',function(){steer(-1)});bind('right',function(){steer(1)});bind('boost',doBoost);addEventListener('keydown',function(e){if(e.code==='ArrowLeft'){e.preventDefault();steer(-1)}if(e.code==='ArrowRight'){e.preventDefault();steer(1)}if(e.code==='Space'){e.preventDefault();doBoost()}})})();</script></body></html>
